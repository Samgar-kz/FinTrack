# Local demo stack: PostgreSQL + API + web UI.
#   docker compose up --build
#   UI:  http://localhost:8080   (demo@fintrack.dev / Demo123!)
#   API: http://localhost:5080/scalar
name: fintrack

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: fintrack
      POSTGRES_USER: fintrack
      POSTGRES_PASSWORD: fintrack
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fintrack -d fintrack"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      ConnectionStrings__Database: Host=db;Port=5432;Database=fintrack;Username=fintrack;Password=fintrack;GSS Encryption Mode=Disable
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-local-demo-signing-key-change-me-0123456789}
      Database__MigrateOnStartup: "true"
      OpenApi__Enabled: "true"
      # Demo data for local evaluation only. Never enable seeding in a real deployment.
      Seed__Enabled: "true"
      Seed__DemoPassword: Demo123!
      Seed__AdminPassword: Admin123!
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5080:8080"

  web:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  pgdata:
